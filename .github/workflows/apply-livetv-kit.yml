name: Setup · Apply Live TV kit

# Upload nuvio-livetv-kit.zip to the root of the repo and this runs automatically.
# If the repo contains a patch instead of the zip, the workflow applies it instead.
on:
  push:
    paths:
      - "nuvio-livetv-kit.zip"
      - "nuvio-livetv.patch"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply kit
        run: |
          if [ -f nuvio-livetv-kit.zip ]; then
            unzip -o nuvio-livetv-kit.zip -x ".github/*" "nuvio-livetv.patch"
            git rm -q nuvio-livetv-kit.zip || true
          elif [ -f nuvio-livetv.patch ]; then
            git apply --whitespace=nowarn nuvio-livetv.patch
            git rm -q nuvio-livetv.patch || true
          else
            echo "nuvio-livetv-kit.zip or nuvio-livetv.patch not found in the repo root" >&2
            exit 1
          fi
          git status --short

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add Live TV (multi M3U/EPG, TiviMate-style guide)"
            git push
          fi
