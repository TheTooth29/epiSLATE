name: Upstream · Prepare IPTV fork update

# Intentionally manual: updates are tested and reviewed before dev or releases change.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "IPTV release tag (blank uses homelessbrian's latest published release)"
        required: false
        type: string
      dry_run:
        description: "Check the merge and customizations only; do not push or create a PR"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-iptv-update
  cancel-in-progress: false

env:
  UPSTREAM: homelessbrian/NuvioPlusIPTV

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.merge.outputs.branch }}
      ready: ${{ steps.merge.outputs.ready }}
    steps:
      - name: Checkout personal fork
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge into a review branch and check customizations
        id: merge
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$UPSTREAM/releases?per_page=100" --jq '[.[] | select(.draft == false and .tag_name != "downloader")][0].tag_name')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = null ]; then
            echo "::error::No published IPTV release found."
            exit 1
          fi
          git check-ref-format "refs/tags/$TAG"
          git remote add iptv "https://github.com/$UPSTREAM.git"
          git fetch --no-tags iptv "refs/tags/$TAG:refs/remotes/iptv/release"
          UPSTREAM_SHA=$(git rev-parse refs/remotes/iptv/release^{commit})
          BASE_SHA=$(git rev-parse HEAD)
          python3 scripts/check-personal-customizations.py
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "This fork already includes IPTV release $TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="updates/iptv-${UPSTREAM_SHA:0:12}-${BASE_SHA:0:8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          if ! git merge --no-edit -m "Merge IPTV release $TAG for review" "$UPSTREAM_SHA"; then
            echo "::error::Merge conflicts require review. dev has not changed."
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi
          # Keep this fork's build/update automation. Upstream workflow changes need separate review.
          git restore --source="$BASE_SHA" --staged --worktree -- .github CUSTOMIZATIONS.md scripts/check-personal-customizations.py
          if ! git diff --cached --quiet; then
            git commit -m "Preserve personal fork build and update configuration"
          fi
          python3 scripts/check-personal-customizations.py
          {
            echo "## IPTV update: $TAG"
            echo "Source: https://github.com/$UPSTREAM/releases/tag/$TAG"
            echo "Merge and customization checks passed."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: no branch pushed, no APK or release published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Never overwrite an existing review branch.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Review branch already exists: $BRANCH. Open its existing pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/update-pr.md" <<'BODY'
          ## Summary

          Merge a published homelessbrian/NuvioPlusIPTV release into this personal fork for testing.

          ## PR type

          - [x] Approved larger or directional change

          ## Why

          Bring in IPTV fork improvements while retaining personal customizations.

          ## Issue or approval

          Repository owner approved this update preparation workflow in Codex. This is a draft: merging and publishing still require review.

          ## Reproduction steps

          Run Prepare IPTV fork update with dry run disabled.

          ## UI / behavior impact

          - [x] UI change has explicit maintainer approval
          - [x] Behavior change has explicit maintainer approval

          ## Policy check

          - [x] This is an owner-requested update in their personal fork.
          - [x] Personal customization checks passed before opening this draft.
          - [x] No automatic merge or release publication.

          ## Scope boundaries

          Preserve the collection hero guard, uppercase row titles, personal update destination, and build configuration. Upstream workflow changes require separate review.

          ## Testing

          The same workflow builds a debug APK after preparation. Check that job before installing; then test QR login, collection tiles and GIFs, catalog hero artwork, uppercase headings, and the update destination.

          ## Screenshots / Video

          Awaiting device verification before approval.

          ## Breaking changes

          Review upstream release notes before merging.

          ## Linked issues

          Owner-authorized update preparation; no separate issue.
          BODY
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$BRANCH" --draft \
            --title "Review IPTV update: $TAG" --body-file "$RUNNER_TEMP/update-pr.md" >> "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::The update branch was prepared, but GitHub could not create its draft PR. The test APK build will still run."
            echo "Open a pull request from $BRANCH into dev after reviewing the repository's Actions permissions." >> "$GITHUB_STEP_SUMMARY"
          fi

  test-apk:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    uses: ./.github/workflows/pr-full-debug-build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.branch }}
    secrets: inherit
    permissions:
      contents: read
